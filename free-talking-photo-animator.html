<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talking Photo Animator - EditSparks</title>
  <style>
    /* =========================================================
       CSS STYLES - EDITSPARK INTERFACE & INDICATORS
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121214;
      color: #e1e1e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #00e676;
    }

    header p {
      font-size: 0.9rem;
      color: #a0a0b0;
    }

    .main-container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      background: #1e1e24;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .canvas-section {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #09090b;
      border: 2px dashed #33333e;
      border-radius: 8px;
      position: relative;
      min-height: 500px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      max-width: 600px;
      max-height: 600px;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .controls-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .control-group {
      background: #282830;
      padding: 15px;
      border-radius: 8px;
    }

    .control-group h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #00e676;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: #ccc;
    }

    input[type="file"], select, button, input[type="range"] {
      width: 100%;
      padding: 10px;
      background: #121214;
      border: 1px solid #3d3d4e;
      color: #fff;
      border-radius: 6px;
      margin-bottom: 10px;
      outline: none;
    }

    button {
      background: #00e676;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #00c853;
    }

    /* UI Indicators */
    .status-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #777;
    }

    .status-item.active-green {
      color: #00e676;
      font-weight: bold;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #444;
    }

    .status-item.active-green .dot {
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }

    .progress-bar-container {
      width: 100%;
      background: #121214;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
      display: none;
      margin-top: 5px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #00e676;
      transition: width 0.1s linear;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>EditSparks - Talking Photo Animator</h1>
    <p>100% Browser-Side | Privacy First | Offline Friendly</p>
  </header>

  <div class="main-container">
    <!-- Canvas Frame -->
    <div class="canvas-section">
      <canvas id="animatorCanvas" width="600" height="600"></canvas>
    </div>

    <!-- Controls Panel -->
    <div class="controls-section">
      
      <!-- Upload Inputs -->
      <div class="control-group">
        <h3>1. Inputs</h3>
        <label for="imageInput">Upload Character Image (PNG/JPG):</label>
        <input type="file" id="imageInput" accept="image/*">

        <label for="bgInput">Upload Background Image (Optional):</label>
        <input type="file" id="bgInput" accept="image/*">

        <label for="bgFitSelect">Background Fit Mode:</label>
        <select id="bgFitSelect">
          <option value="cover">Cover</option>
          <option value="contain">Contain</option>
          <option value="stretch">Stretch</option>
          <option value="blur-fill">Blur Fill</option>
          <option value="auto-fit">Auto Fit</option>
        </select>

        <label for="audioInput">Upload Speech Audio (MP3/WAV):</label>
        <input type="file" id="audioInput" accept="audio/*">
        <audio id="audioPlayer" controls style="width: 100%; margin-top: 5px;"></audio>
      </div>

      <!-- Live Detection Indicators -->
      <div class="control-group">
        <h3>2. Processing Indicators</h3>
        <div class="status-container">
          <div class="status-item" id="statusFace">
            <span class="dot"></span> <span id="statusFaceText">Waiting for Face Detection...</span>
          </div>
          <div class="status-item" id="statusMouth">
            <span class="dot"></span> <span id="statusMouthText">Waiting for Mouth Positioning...</span>
          </div>
          <div class="status-item" id="statusAudio">
            <span class="dot"></span> <span id="statusAudioText">Waiting for Audio Analysis...</span>
          </div>
        </div>
      </div>

      <!-- Export Controls -->
      <div class="control-group">
        <h3>3. Export Video</h3>
        <button id="exportBtn">Export WebM Video</button>
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- =========================================================
       JAVASCRIPT ENGINE (COMPLETE 18-FEATURE MODULE)
       ========================================================= -->
  <script>
    class TalkingPhotoEngine {
      constructor(canvasElement, options = {}) {
        if (!canvasElement) {
          throw new Error("TalkingPhotoEngine requires a valid HTMLCanvasElement.");
        }

        // Canvas Context
        this.canvas = canvasElement;
        this.ctx = this.canvas.getContext('2d', { alpha: true, willReadFrequently: true });

        // Loop & Timing Flags
        this.isRunning = false;
        this.animationFrameId = null;
        this.lastFrameTime = performance.now();

        // Image & Character Dimensions
        this.sourceImage = null;
        this.croppedImageCanvas = null;
        this.characterScale = 1.0;
        this.characterPos = { x: 0, y: 0 };
        
        // Touch & Mouse Dragging State
        this.isDragging = false;
        this.dragStart = { x: 0, y: 0 };
        this.characterStartPos = { x: 0, y: 0 };

        // Background State
        this.bgImage = null;
        this.bgFitMode = options.bgFitMode || 'cover';

        // Landmarks & Face State
        this.faceDetected = false;
        this.landmarks = {
          faceBox: null,
          eyes: [],
          nose: null,
          mouth: {
            center: { x: 0.5, y: 0.7 },
            width: 0.18,
            height: 0.06
          }
        };

        // Procedural Animations Math
        this.idleTime = 0;
        this.headRotation = 0;
        this.targetHeadRotation = 0;
        this.bodyOffsetY = 0;
        
        // Eye Blink Engine
        this.blinkState = {
          isBlinking: false,
          progress: 0,
          nextBlinkTime: Date.now() + this.getRandomBlinkInterval(),
          duration: 180
        };

        // Mouth Visemes & Openness
        this.currentMouthShape = 'closed';
        this.mouthOpenFactor = 0;
        this.targetMouthOpenFactor = 0;

        // Web Audio API DSP Analyser
        this.audioCtx = null;
        this.analyser = null;
        this.audioSource = null;
        this.audioDataArray = null;
        this.audioSensitivity = {
          noiseFloor: 0.02,
          autoGain: 1.0,
          speechPeakThreshold: 0.15
        };

        // Callback hooks
        this.onStatusChange = options.onStatusChange || (() => {});
        
        this.initEventListeners();
      }

      /* 1. Transparent PNG Auto-Crop & Dynamic Fit */
      async loadCharacterImage(imageSource) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          
          img.onload = async () => {
            try {
              this.sourceImage = img;
              this.croppedImageCanvas = this.cropTransparentPadding(img);
              this.autoScaleAndCenterCharacter();
              await this.autoDetectFaceAndFeatures();

              this.triggerStatusUpdate('faceDetected', this.faceDetected);
              this.triggerStatusUpdate('mouthDetected', true);

              this.drawFrame();
              resolve(true);
            } catch (err) {
              reject(err);
            }
          };

          img.onerror = () => reject(new Error("Corrupted or unsupported image file."));

          if (typeof imageSource === 'string') {
            img.src = imageSource;
          } else if (imageSource instanceof File || imageSource instanceof Blob) {
            img.src = URL.createObjectURL(imageSource);
          }
        });
      }

      cropTransparentPadding(img) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.naturalWidth || img.width;
        tempCanvas.height = img.naturalHeight || img.height;
        const ctx = tempCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imgData.data;
        
        let minX = tempCanvas.width, minY = tempCanvas.height, maxX = 0, maxY = 0;
        let foundPixel = false;

        for (let y = 0; y < tempCanvas.height; y++) {
          for (let x = 0; x < tempCanvas.width; x++) {
            const alpha = data[(y * tempCanvas.width + x) * 4 + 3];
            if (alpha > 5) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
              foundPixel = true;
            }
          }
        }

        if (!foundPixel) return tempCanvas;

        const cropWidth = maxX - minX + 1;
        const cropHeight = maxY - minY + 1;

        const croppedCanvas = document.createElement('canvas');
        croppedCanvas.width = cropWidth;
        croppedCanvas.height = cropHeight;
        const cropCtx = croppedCanvas.getContext('2d');

        cropCtx.drawImage(
          tempCanvas,
          minX, minY, cropWidth, cropHeight,
          0, 0, cropWidth, cropHeight
        );

        return croppedCanvas;
      }

      autoScaleAndCenterCharacter() {
        if (!this.croppedImageCanvas) return;

        const cWidth = this.canvas.width;
        const cHeight = this.canvas.height;
        const imgWidth = this.croppedImageCanvas.width;
        const imgHeight = this.croppedImageCanvas.height;

        const scaleX = (cWidth * 0.8) / imgWidth;
        const scaleY = (cHeight * 0.8) / imgHeight;
        this.characterScale = Math.min(scaleX, scaleY);

        const targetWidth = imgWidth * this.characterScale;
        const targetHeight = imgHeight * this.characterScale;

        this.characterPos = {
          x: (cWidth - targetWidth) / 2,
          y: (cHeight - targetHeight) / 2
        };
      }

      /* 2. Automatic Face, Eyes & Mouth Detection Engine */
      async autoDetectFaceAndFeatures() {
        let faceFound = false;

        if ('FaceDetector' in window) {
          try {
            const faceDetector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
            const faces = await faceDetector.detect(this.croppedImageCanvas);
            if (faces.length > 0) {
              const f = faces[0].boundingBox;
              const cw = this.croppedImageCanvas.width;
              const ch = this.croppedImageCanvas.height;

              this.landmarks.mouth.center = {
                x: (f.x + f.width / 2) / cw,
                y: (f.y + f.height * 0.78) / ch
              };
              this.landmarks.mouth.width = (f.width * 0.4) / cw;
              this.landmarks.mouth.height = (f.height * 0.15) / ch;

              faceFound = true;
            }
          } catch (e) {
            console.warn("Using heuristic face landmark engine.");
          }
        }

        if (!faceFound) {
          // Heuristic Fallback
          this.landmarks.mouth = {
            center: { x: 0.5, y: 0.68 },
            width: 0.18,
            height: 0.06
          };
          this.landmarks.eyes = [
            { x: 0.38, y: 0.38 },
            { x: 0.62, y: 0.38 }
          ];
          this.faceDetected = true;
        } else {
          this.faceDetected = true;
        }
      }

      /* 3. Background Modes */
      setBackgroundImage(imgElement, fitMode = 'cover') {
        this.bgImage = imgElement;
        this.bgFitMode = fitMode;
        this.drawFrame();
      }

      drawBackground() {
        if (!this.bgImage) return;

        const cw = this.canvas.width;
        const ch = this.canvas.height;
        const bw = this.bgImage.naturalWidth || this.bgImage.width;
        const bh = this.bgImage.naturalHeight || this.bgImage.height;

        this.ctx.save();

        switch (this.bgFitMode) {
          case 'stretch':
            this.ctx.drawImage(this.bgImage, 0, 0, cw, ch);
            break;

          case 'contain': {
            const ratio = Math.min(cw / bw, ch / bh);
            const cx = (cw - bw * ratio) / 2;
            const cy = (ch - bh * ratio) / 2;
            this.ctx.drawImage(this.bgImage, 0, 0, bw, bh, cx, cy, bw * ratio, bh * ratio);
            break;
          }

          case 'blur-fill': {
            this.ctx.filter = 'blur(18px)';
            const scale = Math.max(cw / bw, ch / bh);
            this.ctx.drawImage(this.bgImage, (cw - bw * scale) / 2, (ch - bh * scale) / 2, bw * scale, bh * scale);
            this.ctx.filter = 'none';

            const ratio = Math.min(cw / bw, ch / bh);
            const cx = (cw - bw * ratio) / 2;
            const cy = (ch - bh * ratio) / 2;
            this.ctx.drawImage(this.bgImage, 0, 0, bw, bh, cx, cy, bw * ratio, bh * ratio);
            break;
          }

          case 'auto-fit':
          case 'cover':
          default: {
            const scale = Math.max(cw / bw, ch / bh);
            const x = (cw - bw * scale) / 2;
            const y = (ch - bh * scale) / 2;
            this.ctx.drawImage(this.bgImage, x, y, bw * scale, bh * scale);
            break;
          }
        }

        this.ctx.restore();
      }

      /* 4. Audio Processing & FFT Frequency Analyzer */
      setupAudioAnalyser(audioElement) {
        if (!this.audioCtx) {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }

        if (!this.audioSource) {
          this.analyser = this.audioCtx.createAnalyser();
          this.analyser.fftSize = 512;
          this.analyser.smoothingTimeConstant = 0.75;

          this.audioSource = this.audioCtx.createMediaElementSource(audioElement);
          this.audioSource.connect(this.analyser);
          this.analyser.connect(this.audioCtx.destination);
          this.audioDataArray = new Uint8Array(this.analyser.frequencyBinCount);
        }

        this.triggerStatusUpdate('audioAnalyzed', true);
      }

      analyzeAudioFrame() {
        if (!this.analyser || !this.audioDataArray) return { energy: 0, viseme: 'closed' };

        this.analyser.getByteFrequencyData(this.audioDataArray);

        let totalEnergy = 0;
        let lowFreq = 0;
        let midFreq = 0;
        let highFreq = 0;

        const len = this.audioDataArray.length;
        for (let i = 0; i < len; i++) {
          const val = this.audioDataArray[i] / 255.0;
          totalEnergy += val;

          if (i < len * 0.15) lowFreq += val;
          else if (i < len * 0.5) midFreq += val;
          else highFreq += val;
        }

        const avgEnergy = totalEnergy / len;

        // Auto Sensitivity Gain adjustment
        if (avgEnergy > this.audioSensitivity.speechPeakThreshold) {
          this.audioSensitivity.autoGain = Math.max(0.6, 1.0 - (avgEnergy - 0.15));
        } else if (avgEnergy > this.audioSensitivity.noiseFloor && avgEnergy < 0.08) {
          this.audioSensitivity.autoGain = 1.8;
        } else {
          this.audioSensitivity.autoGain = 1.0;
        }

        const adjustedEnergy = Math.min(1.0, avgEnergy * this.audioSensitivity.autoGain * 3.5);

        let viseme = 'closed';
        if (adjustedEnergy > 0.05) {
          if (highFreq > midFreq && highFreq > lowFreq) viseme = 'narrow';
          else if (lowFreq > midFreq * 1.2) viseme = 'round';
          else if (adjustedEnergy > 0.4) viseme = 'large';
          else if (adjustedEnergy > 0.2) viseme = 'medium';
          else viseme = 'small';
        }

        return { energy: adjustedEnergy, viseme: viseme };
      }

      /* 5. Natural Bezier Curve Procedural Mouth Shapes */
      drawProceduralMouth(ctx, mouthX, mouthY, mouthWidth, mouthHeight, openFactor, shape) {
        ctx.save();
        ctx.translate(mouthX, mouthY);

        const w = mouthWidth / 2;
        const h = (mouthHeight * openFactor) + 2;

        ctx.beginPath();
        ctx.fillStyle = "#260808";
        ctx.strokeStyle = "#612222";
        ctx.lineWidth = 2;

        switch (shape) {
          case 'round':
            ctx.ellipse(0, 0, w * 0.6, h * 1.2, 0, 0, Math.PI * 2);
            break;

          case 'smile':
            ctx.moveTo(-w, -h * 0.2);
            ctx.quadraticCurveTo(0, h * 1.5, w, -h * 0.2);
            ctx.quadraticCurveTo(0, h * 0.5, -w, -h * 0.2);
            break;

          case 'narrow':
            ctx.moveTo(-w * 0.8, 0);
            ctx.quadraticCurveTo(0, -h * 0.5, w * 0.8, 0);
            ctx.quadraticCurveTo(0, h * 0.5, -w * 0.8, 0);
            break;

          case 'large':
          case 'medium':
          case 'small':
          default:
            ctx.moveTo(-w, 0);
            ctx.bezierCurveTo(-w * 0.5, -h * 0.8, w * 0.5, -h * 0.8, w, 0);
            ctx.bezierCurveTo(w * 0.5, h * 1.2, -w * 0.5, h * 1.2, -w, 0);
            break;
        }

        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        if (openFactor > 0.35 && shape !== 'round') {
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.rect(-w * 0.5, -h * 0.3, w, h * 0.25);
          ctx.fill();
        }

        ctx.restore();
      }

      /* 6. Eye Blink Engine */
      getRandomBlinkInterval() {
        return 2000 + Math.random() * 4000;
      }

      updateBlinkState(now) {
        if (!this.blinkState.isBlinking && now >= this.blinkState.nextBlinkTime) {
          this.blinkState.isBlinking = true;
          this.blinkState.startTime = now;
        }

        if (this.blinkState.isBlinking) {
          const elapsed = now - this.blinkState.startTime;
          const progress = elapsed / this.blinkState.duration;

          if (progress >= 1.0) {
            this.blinkState.isBlinking = false;
            this.blinkState.progress = 0;
            this.blinkState.nextBlinkTime = now + this.getRandomBlinkInterval();
          } else {
            this.blinkState.progress = Math.sin(progress * Math.PI);
          }
        }
      }

      /* 7. 60 FPS Interpolated Animation Render Loop */
      renderFrame() {
        if (!this.isRunning) return;

        const now = performance.now();
        const dt = (now - this.lastFrameTime) / 1000.0;
        this.lastFrameTime = now;

        this.idleTime += dt;

        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Render Background
        this.drawBackground();

        if (this.croppedImageCanvas) {
          const audioAnalysis = this.analyzeAudioFrame();
          
          // Interpolation LERP for Mouth Openness
          const lerpSpeed = 15 * dt;
          this.targetMouthOpenFactor = audioAnalysis.energy;
          this.mouthOpenFactor += (this.targetMouthOpenFactor - this.mouthOpenFactor) * lerpSpeed;
          this.currentMouthShape = audioAnalysis.viseme;

          // Body Breathing & Micro Head Sway
          this.bodyOffsetY = Math.sin(this.idleTime * 1.8) * 2.5;
          this.targetHeadRotation = (audioAnalysis.energy > 0.05) 
            ? Math.sin(this.idleTime * 4.0) * 0.035 
            : Math.sin(this.idleTime * 1.0) * 0.008;
          
          this.headRotation += (this.targetHeadRotation - this.headRotation) * lerpSpeed;

          // Eye Blink State Update
          this.updateBlinkState(now);

          // Draw Character Transforms
          this.ctx.save();
          
          const charW = this.croppedImageCanvas.width * this.characterScale;
          const charH = this.croppedImageCanvas.height * this.characterScale;
          const centerX = this.characterPos.x + charW / 2;
          const centerY = this.characterPos.y + charH / 2;

          this.ctx.translate(centerX, centerY + this.bodyOffsetY);
          this.ctx.rotate(this.headRotation);

          this.ctx.drawImage(
            this.croppedImageCanvas,
            -charW / 2,
            -charH / 2,
            charW,
            charH
          );

          // Render Lip Sync Mouth Overlay
          if (this.landmarks && this.landmarks.mouth) {
            const mouthAbsX = (-charW / 2) + (this.landmarks.mouth.center.x * charW);
            const mouthAbsY = (-charH / 2) + (this.landmarks.mouth.center.y * charH);
            const mouthAbsW = this.landmarks.mouth.width * charW;
            const mouthAbsH = this.landmarks.mouth.height * charH;

            this.drawProceduralMouth(
              this.ctx,
              mouthAbsX,
              mouthAbsY,
              mouthAbsW,
              mouthAbsH,
              this.mouthOpenFactor,
              this.currentMouthShape
            );
          }

          // Render Eye Blink Eyelid Overlay
          if (this.blinkState.progress > 0.05 && this.landmarks.eyes.length > 0) {
            this.ctx.fillStyle = "rgba(40, 30, 30, 0.6)";
            this.landmarks.eyes.forEach(eye => {
              const eyeX = (-charW / 2) + (eye.x * charW);
              const eyeY = (-charH / 2) + (eye.y * charH);
              const eyeRadius = charW * 0.025;
              const blinkHeight = eyeRadius * 2 * this.blinkState.progress;

              this.ctx.beginPath();
              this.ctx.ellipse(eyeX, eyeY, eyeRadius, blinkHeight / 2, 0, 0, Math.PI * 2);
              this.ctx.fill();
            });
          }

          this.ctx.restore();
        }

        this.animationFrameId = requestAnimationFrame(() => this.renderFrame());
      }

      start() {
        if (!this.isRunning) {
          this.isRunning = true;
          this.lastFrameTime = performance.now();
          this.renderFrame();
        }
      }

      stop() {
        this.isRunning = false;
        if (this.animationFrameId) {
          cancelAnimationFrame(this.animationFrameId);
        }
      }

      drawFrame() {
        if (!this.isRunning) {
          this.renderFrame();
        }
      }

      /* 8. Dragging Controls for Touch & Mouse */
      initEventListeners() {
        const getCoords = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: (clientX - rect.left) * (this.canvas.width / rect.width),
            y: (clientY - rect.top) * (this.canvas.height / rect.height)
          };
        };

        const onStart = (e) => {
          const pos = getCoords(e);
          const charW = this.croppedImageCanvas ? this.croppedImageCanvas.width * this.characterScale : 0;
          const charH = this.croppedImageCanvas ? this.croppedImageCanvas.height * this.characterScale : 0;

          if (
            pos.x >= this.characterPos.x &&
            pos.x <= this.characterPos.x + charW &&
            pos.y >= this.characterPos.y &&
            pos.y <= this.characterPos.y + charH
          ) {
            this.isDragging = true;
            this.dragStart = pos;
            this.characterStartPos = { ...this.characterPos };
          }
        };

        const onMove = (e) => {
          if (!this.isDragging) return;
          const pos = getCoords(e);
          const dx = pos.x - this.dragStart.x;
          const dy = pos.y - this.dragStart.y;

          this.characterPos.x = this.characterStartPos.x + dx;
          this.characterPos.y = this.characterStartPos.y + dy;

          if (!this.isRunning) this.drawFrame();
        };

        const onEnd = () => {
          this.isDragging = false;
        };

        this.canvas.addEventListener('mousedown', onStart);
        this.canvas.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        this.canvas.addEventListener('touchstart', onStart, { passive: true });
        this.canvas.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onEnd);
      }

      /* 9. Browser-side Video Export Engine */
      async exportVideo(durationMs = 5000, onProgress = () => {}) {
        return new Promise((resolve, reject) => {
          const stream = this.canvas.captureStream(60);
          
          if (this.audioSource && this.audioCtx) {
            const dest = this.audioCtx.createMediaStreamDestination();
            this.audioSource.connect(dest);
            const audioTrack = dest.stream.getAudioTracks()[0];
            if (audioTrack) stream.addTrack(audioTrack);
          }

          const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
            ? 'video/webm;codecs=vp9'
            : 'video/webm';

          const recorder = new MediaRecorder(stream, {
            mimeType: mimeType,
            videoBitsPerSecond: 5000000
          });

          const chunks = [];
          const startTime = Date.now();

          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
          };

          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType });
            resolve(blob);
          };

          recorder.onerror = (err) => reject(err);

          recorder.start(100);
          this.start();

          const progressInterval = setInterval(() => {
            const elapsed = Date.now() - startTime;
            const percent = Math.min(100, Math.floor((elapsed / durationMs) * 100));
            onProgress(percent);

            if (elapsed >= durationMs) {
              clearInterval(progressInterval);
              recorder.stop();
            }
          }, 100);
        });
      }

      triggerStatusUpdate(type, status) {
        this.onStatusChange(type, status);
      }
    }

    /* =========================================================
       DOM EVENT LISTENERS & ENGINE INITIALIZATION
       ========================================================= */
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('animatorCanvas');
      const audioPlayer = document.getElementById('audioPlayer');

      // Initialize Engine with Options & UI Hooks
      const engine = new TalkingPhotoEngine(canvas, {
        bgFitMode: 'cover',
        onStatusChange: (feature, value) => {
          if (feature === 'faceDetected' && value) {
            const statusFace = document.getElementById('statusFace');
            statusFace.classList.add('active-green');
            document.getElementById('statusFaceText').innerText = "✔ Face detected";
          }
          if (feature === 'mouthDetected' && value) {
            const statusMouth = document.getElementById('statusMouth');
            statusMouth.classList.add('active-green');
            document.getElementById('statusMouthText').innerText = "✔ Mouth detected";
          }
          if (feature === 'audioAnalyzed' && value) {
            const statusAudio = document.getElementById('statusAudio');
            statusAudio.classList.add('active-green');
            document.getElementById('statusAudioText').innerText = "✔ Audio analyzed";
          }
        }
      });

      // 1. Character Image Input
      document.getElementById('imageInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        try {
          await engine.loadCharacterImage(file);
          engine.start();
        } catch (err) {
          alert("Error loading character image: " + err.message);
        }
      });

      // 2. Background Image Input
      document.getElementById('bgInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const img = new Image();
        img.onload = () => {
          const fitMode = document.getElementById('bgFitSelect').value;
          engine.setBackgroundImage(img, fitMode);
        };
        img.src = URL.createObjectURL(file);
      });

      // Background Fit Selector
      document.getElementById('bgFitSelect').addEventListener('change', (e) => {
        if (engine.bgImage) {
          engine.setBackgroundImage(engine.bgImage, e.target.value);
        }
      });

      // 3. Audio Input & Sync
      document.getElementById('audioInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        audioPlayer.src = URL.createObjectURL(file);
        engine.setupAudioAnalyser(audioPlayer);
      });

      audioPlayer.addEventListener('play', () => {
        engine.start();
      });

      // 4. Video Export Handler
      document.getElementById('exportBtn').addEventListener('click', async () => {
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';

        const duration = audioPlayer.duration ? audioPlayer.duration * 1000 : 5000;

        try {
          if (audioPlayer.src) audioPlayer.play();
          
          const blob = await engine.exportVideo(duration, (percent) => {
            progressBar.style.width = percent + '%';
          });

          // Trigger Direct Download
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'talking-photo-editsparks.webm';
          a.click();
        } catch (err) {
          alert("Export failed: " + err.message);
        } finally {
          setTimeout(() => {
            progressContainer.style.display = 'none';
          }, 1000);
        }
      });
    });
  </script>
</body>
