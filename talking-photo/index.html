<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Talking Photo Animator Online | EditSparks</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="dark-theme">
  <!-- Top App Bar -->
  <header class="app-header" role="banner">
    <div class="brand">
      <svg class="svg-icon brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <h1 class="brand-title">EditSparks <span class="highlight">Talking Photo</span></h1>
    </div>

    <div class="header-center-controls">
      <div class="btn-group">
        <button id="btn-new-project" class="tool-btn" title="New Project">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>New</span>
        </button>
        <button id="btn-open-project" class="tool-btn" title="Open Project">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Open</span>
        </button>
        <button id="btn-save-project" class="tool-btn" title="Save Project">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span>Save</span>
        </button>
      </div>

      <div class="history-controls">
        <button id="btn-undo" class="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <button id="btn-redo" class="icon-btn" title="Redo (Ctrl+Y)" aria-label="Redo">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
        </button>
      </div>

      <span id="autosave-status" class="status-indicator">
        <span class="status-dot"></span> Autosaved
      </span>
    </div>

    <div class="header-actions">
      <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle Theme" title="Toggle Theme">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- Workspace Container -->
  <main class="app-main" role="main">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar sidebar-left" aria-label="Asset Library">
      <nav class="sidebar-tabs" role="tablist">
        <button class="tab-btn active" data-tab="characters-tab" role="tab" aria-selected="true">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="label">Characters</span>
        </button>
        <button class="tab-btn" data-tab="backgrounds-tab" role="tab" aria-selected="false">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span class="label">Backgrounds</span>
        </button>
        <button class="tab-btn" data-tab="audio-tab" role="tab" aria-selected="false">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <span class="label">Voice / Audio</span>
        </button>
      </nav>

      <div class="sidebar-content">
        <!-- Characters Panel -->
        <section id="characters-tab" class="tab-content active" role="tabpanel">
          <div class="panel-header-sticky">
            <div class="search-box">
              <svg class="svg-icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="character-search" class="custom-input" placeholder="Search characters...">
            </div>
            
            <div class="filter-chips" id="category-filters">
              <button class="chip active" data-cat="all">All</button>
              <button class="chip" data-cat="male">Male</button>
              <button class="chip" data-cat="female">Female</button>
              <button class="chip" data-cat="kids">Kids</button>
              <button class="chip" data-cat="animals">Animals</button>
              <button class="chip" data-cat="fav">Favorites</button>
            </div>
          </div>

          <div id="character-list" class="card-grid"></div>
        </section>

        <!-- Backgrounds Panel -->
        <section id="backgrounds-tab" class="tab-content" role="tabpanel" hidden>
          <h2 class="panel-title">Background Presets</h2>
          <div class="card-grid">
            <div class="bg-preset-card active" data-bg="solid" data-color="#0f172a">
              <div class="bg-preview-box" style="background: #0f172a;"></div>
              <span>Dark Slate</span>
            </div>
            <div class="bg-preset-card" data-bg="gradient" data-color="linear-gradient(135deg, #1e1b4b, #311042)">
              <div class="bg-preview-box" style="background: linear-gradient(135deg, #1e1b4b, #311042);"></div>
              <span>Neon Violet</span>
            </div>
            <div class="bg-preset-card" data-bg="gradient" data-color="linear-gradient(135deg, #064e3b, #022c22)">
              <div class="bg-preview-box" style="background: linear-gradient(135deg, #064e3b, #022c22);"></div>
              <span>Deep Emerald</span>
            </div>
          </div>
        </section>

        <!-- Audio Panel -->
        <section id="audio-tab" class="tab-content" role="tabpanel" hidden>
          <h2 class="panel-title">Audio & Voice Script</h2>
          <div class="audio-upload-box">
            <input type="file" id="audio-file-input" accept="audio/*" class="hidden-file-input">
            <button id="btn-upload-audio" class="primary-btn wide">
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span>Upload Voice Audio</span>
            </button>
            <p id="audio-file-name" class="file-name-indicator">No file loaded</p>
          </div>
        </section>
      </div>
    </aside>

    <!-- Canvas Stage Section -->
    <section class="stage-container" aria-label="Interactive Canvas Workspace">
      <div class="canvas-viewport" id="canvas-viewport">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <canvas id="main-canvas" width="1280" height="720"></canvas>
          <div id="guide-safe-area" class="canvas-guide safe-area-guide hidden"></div>
          <div id="guide-rule-thirds" class="canvas-guide rule-thirds-guide hidden"></div>
          <div id="guide-grid" class="canvas-guide snap-grid-guide hidden"></div>
        </div>
      </div>

      <!-- Floating Canvas Toolbar -->
      <div class="canvas-toolbar">
        <div class="guide-toggles">
          <button id="toggle-safe-area" class="tool-btn icon-only" title="Safe Area"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="6" y="6" width="12" height="12"/></svg></button>
          <button id="toggle-thirds" class="tool-btn icon-only" title="Rule of Thirds"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg></button>
          <button id="toggle-grid" class="tool-btn icon-only" title="Snap Grid"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
        </div>
        <div class="divider"></div>
        <div class="zoom-controls">
          <button id="zoom-out-btn" class="tool-btn icon-only" title="Zoom Out"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
          <span id="zoom-indicator" class="zoom-label">100%</span>
          <button id="zoom-in-btn" class="tool-btn icon-only" title="Zoom In"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
        </div>
        <div class="preset-zoom-controls">
          <button id="zoom-fit-btn" class="tool-btn">Fit</button>
          <button id="zoom-100-btn" class="tool-btn">100%</button>
        </div>
      </div>

      <!-- Bottom Audio/Timeline Toolbar -->
      <footer class="bottom-toolbar" role="region" aria-label="Playback Controls">
        <div class="media-controls">
          <button id="play-btn" class="control-btn primary icon-only" title="Play"><svg class="svg-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
          <button id="pause-btn" class="control-btn icon-only" title="Pause"><svg class="svg-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>
          <button id="stop-btn" class="control-btn icon-only" title="Stop"><svg class="svg-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16"/></svg></button>
          <button id="loop-btn" class="control-btn icon-only" title="Toggle Loop"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
        </div>

        <div class="timeline-container">
          <span id="current-time" class="time-display">00:00</span>
          <input type="range" id="timeline-slider" class="custom-slider" min="0" max="100" value="0">
          <span id="total-duration" class="time-display">00:00</span>
        </div>

        <div class="engine-metrics">
          <span class="metric-badge">FPS: <strong id="fps-display">60</strong></span>
          <span id="render-status" class="status-chip idle">Idle</span>
        </div>

        <div class="audio-speed-controls">
          <button id="mute-btn" class="icon-btn" title="Mute/Unmute"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
          <input type="range" id="volume-slider" class="custom-slider mini" min="0" max="100" value="80">
          <select id="speed-select" class="custom-select">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </div>
      </footer>
    </section>

    <!-- Right Inspector Sidebar -->
    <aside class="sidebar sidebar-right" aria-label="Properties Panel">
      <div class="accordion-group">
        <details class="accordion-panel" open>
          <summary class="accordion-header"><span>Character Transform</span><svg class="svg-icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></summary>
          <div class="accordion-body">
            <div class="control-row"><label for="scale-range">Scale</label><input type="range" id="scale-range" class="custom-slider" min="10" max="200" value="100"><span id="scale-val" class="value-badge">100%</span></div>
            <div class="control-row"><label for="rotation-range">Rotation</label><input type="range" id="rotation-range" class="custom-slider" min="-180" max="180" value="0"><span id="rotation-val" class="value-badge">0°</span></div>
            <div class="control-row"><label for="pos-x-range">Position X</label><input type="range" id="pos-x-range" class="custom-slider" min="-300" max="300" value="0"><span id="pos-x-val" class="value-badge">0px</span></div>
            <div class="control-row"><label for="pos-y-range">Position Y</label><input type="range" id="pos-y-range" class="custom-slider" min="-300" max="300" value="0"><span id="pos-y-val" class="value-badge">0px</span></div>
          </div>
        </details>

        <details class="accordion-panel" open>
          <summary class="accordion-header"><span>Animation Behaviors</span><svg class="svg-icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></summary>
          <div class="accordion-body">
            <label class="custom-switch"><input type="checkbox" id="toggle-blink" checked><span class="switch-slider"></span><span class="switch-label">Auto Eye Blink</span></label>
            <label class="custom-switch"><input type="checkbox" id="toggle-head" checked><span class="switch-slider"></span><span class="switch-label">Head Tilt Motion</span></label>
            <label class="custom-switch"><input type="checkbox" id="toggle-idle" checked><span class="switch-slider"></span><span class="switch-label">Breathing Idle</span></label>
          </div>
        </details>

        <details class="accordion-panel" open>
          <summary class="accordion-header"><span>Export Settings</span><svg class="svg-icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></summary>
          <div class="accordion-body">
            <div class="control-row"><label for="res-select">Resolution</label><select id="res-select" class="custom-select"><option value="720p">720p (HD)</option><option value="1080p" selected>1080p (FHD)</option></select></div>
            <div class="control-row"><label for="fps-select">Frame Rate</label><select id="fps-select" class="custom-select"><option value="30" selected>30 FPS</option><option value="60">60 FPS</option></select></div>
            <button id="export-render-btn" class="primary-btn wide">
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
              <span>Export Video (WebM)</span>
            </button>
          </div>
        </details>
      </div>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
