<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditSpark - Compress Image to Target Size</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Upload Area */
        .upload-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary);
            background: #f0fdf4;
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .upload-zone p {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .upload-zone span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        #fileInput {
            display: none;
        }

        /* Workspace Grid */
        .workspace {
            display: none;
            margin-top: 2rem;
            flex-direction: column;
            gap: 2rem;
        }

        .controls-card {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 300px;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 1rem;
        }

        .input-wrapper input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 1rem;
            font-weight: 500;
        }

        .input-wrapper span {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        /* Preview Section */
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 640px) {
            .preview-grid {
                grid-template-columns: 1fr;
            }
        }

        .preview-box {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            background: #ffffff;
        }

        .preview-box h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .img-container {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            overflow: hidden;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .file-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-badge {
            color: var(--success);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Loader */
        .loader {
            display: none;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .spinner {
            animation: rotate 2s linear infinite;
            width: 20px;
            height: 20px;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Compress Image to Target Size</h1>
            <p>Upload your image and specify the exact KB size you need.</p>
        </header>

        <!-- Upload Zone -->
        <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <i data-lucide="image-up" class="upload-icon"></i>
            <p>Click to upload or drag and drop</p>
            <span>Supports PNG, JPG, JPEG, WEBP</span>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- Workspace Section -->
        <div class="workspace" id="workspace">
            <div class="controls-card">
                <div class="input-group">
                    <label for="targetSize">Target Size</label>
                    <div class="input-wrapper">
                        <input type="number" id="targetSize" value="50" min="1">
                        <span>KB</span>
                    </div>
                </div>
                <button class="btn" id="compressBtn">
                    <i data-lucide="sliders"></i> Compress Image
                </button>

                <div class="loader" id="loader">
                    <i data-lucide="loader-2" class="spinner"></i> Optimizing image quality to match target size...
                </div>
            </div>

            <!-- Previews -->
            <div class="preview-grid">
                <!-- Original Image -->
                <div class="preview-box">
                    <h3>Original Image</h3>
                    <div class="img-container">
                        <img id="originalPreview" alt="Original Preview">
                    </div>
                    <div class="file-info">
                        <span id="originalName">image.jpg</span>
                        <span id="originalSize">0 KB</span>
                    </div>
                </div>

                <!-- Compressed Image -->
                <div class="preview-box">
                    <h3>Compressed Result</h3>
                    <div class="img-container">
                        <img id="compressedPreview" alt="Compressed Preview">
                    </div>
                    <div class="file-info">
                        <span class="status-badge" id="statusBadge" style="display: none;">
                            <i data-lucide="check-circle-2" style="width: 16px; height: 16px;"></i> Ready
                        </span>
                        <span id="compressedSize" style="margin-left: auto; font-weight: 600;">0 KB</span>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div style="text-align: right;">
                <button class="btn" id="downloadBtn" style="background: var(--success);">
                    <i data-lucide="download"></i> Download Compressed Image
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const workspace = document.getElementById('workspace');
        const originalPreview = document.getElementById('originalPreview');
        const compressedPreview = document.getElementById('compressedPreview');
        const originalSizeText = document.getElementById('originalSize');
        const compressedSizeText = document.getElementById('compressedSize');
        const originalNameText = document.getElementById('originalName');
        const targetSizeInput = document.getElementById('targetSize');
        const compressBtn = document.getElementById('compressBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const loader = document.getElementById('loader');
        const statusBadge = document.getElementById('statusBadge');

        let sourceImage = new Image();
        let fileType = 'image/jpeg';
        let fileName = 'compressed-image.jpg';

        // Drag and Drop Logic
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) handleFile(files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please upload a valid image file.');
                return;
            }

            fileType = file.type;
            fileName = file.name;
            originalNameText.textContent = fileName;
            originalSizeText.textContent = formatBytes(file.size);

            const reader = new FileReader();
            reader.onload = (e) => {
                originalPreview.src = e.target.result;
                sourceImage.src = e.target.result;
                
                sourceImage.onload = () => {
                    workspace.style.display = 'flex';
                    dropZone.style.display = 'none';
                    // Auto run initial compression
                    compressImage();
                };
            };
            reader.readAsDataURL(file);
        }

        // Binary Search Compression Algorithm
        async function compressImage() {
            loader.style.display = 'flex';
            statusBadge.style.display = 'none';
            compressBtn.disabled = true;

            const targetSizeInBytes = targetSizeInput.value * 1024;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Setup dimensions
            let width = sourceImage.width;
            let height = sourceImage.height;
            canvas.width = width;
            canvas.height = height;

            let minQuality = 0.01;
            let maxQuality = 1.0;
            let iterations = 8;
            let blob = null;

            // Step 1: Render initially to Canvas
            ctx.drawImage(sourceImage, 0, 0, width, height);

            // Step 2: Adaptive iterative adjustment loop
            for (let i = 0; i < iterations; i++) {
                let midQuality = (minQuality + maxQuality) / 2;
                blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', midQuality));
                
                if (blob.size > targetSizeInBytes) {
                    maxQuality = midQuality; // Reduce quality window
                } else {
                    minQuality = midQuality; // Increase quality baseline
                }
            }

            // Fallback strategy if even lowest quality is larger -> scale down resolution
            if (blob && blob.size > targetSizeInBytes) {
                let scale = 0.8;
                while (blob.size > targetSizeInBytes && scale > 0.2) {
                    canvas.width = sourceImage.width * scale;
                    canvas.height = sourceImage.height * scale;
                    ctx.drawImage(sourceImage, 0, 0, canvas.width, canvas.height);
                    blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.5));
                    scale -= 0.15;
                }
            }

            // Display result
            if (blob) {
                const url = URL.createObjectURL(blob);
                compressedPreview.src = url;
                compressedSizeText.textContent = formatBytes(blob.size);
                
                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `compressed_${fileName.split('.')[0]}.jpg`;
                    a.click();
                };

                statusBadge.style.display = 'flex';
            }

            loader.style.display = 'none';
            compressBtn.disabled = false;
        }

        compressBtn.addEventListener('click', compressImage);

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
