<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditSpark - Compress Image to Target Size</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --success: #10b981;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .input-control {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.7rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 1rem;
            color: var(--text-main);
            background-color: var(--bg-main);
            transition: var(--transition);
        }

        .input-control:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--bg-card);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            background: var(--bg-main);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .upload-zone i {
            color: var(--primary);
            background: var(--bg-card);
            padding: 1rem;
            border-radius: 50%;
            box-shadow: var(--shadow);
        }

        .upload-zone h3 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .upload-zone p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-success {
            background: var(--success);
            color: white;
            display: none;
        }

        .btn-success:hover {
            opacity: 0.9;
        }

        /* Results Table Styles */
        .results-container {
            display: none;
            margin-top: 2rem;
            overflow-x: auto;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        .results-table th {
            background: var(--bg-main);
            padding: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border);
        }

        .results-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .preview-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .badge {
            display: inline-flex;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-danger { background: #fee2e2; color: #ef4444; }
        .badge-success { background: #d1fae5; color: #10b981; }

        .download-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        /* Loading Spinner */
        .spinner {
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Compress Image to Target Size</h1>
            <p>Perfectly shrink your JPEG, PNG, or WebP images to an exact KB target size.</p>
        </header>

        <div class="card">
            <div class="control-panel">
                <div class="input-group">
                    <label for="targetSize">Target Size</label>
                    <div class="input-wrapper">
                        <i data-lucide="hard-drive"></i>
                        <input type="number" id="targetSize" class="input-control" value="50" min="5" max="5000">
                    </div>
                </div>
                <div class="input-group">
                    <label for="sizeUnit">Unit</label>
                    <div class="input-wrapper">
                        <i data-lucide="layers"></i>
                        <select id="sizeUnit" class="input-control">
                            <option value="KB">KB (Kilobytes)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="upload-zone" id="dropZone">
                <i data-lucide="upload-cloud" style="width: 32px; height: 32px;"></i>
                <h3>Drag & drop your images here</h3>
                <p>Supports Bulk Uploads (JPEG, PNG, WebP)</p>
                <button class="btn" style="background: var(--primary-light); color: var(--primary);">Browse Files</button>
                <input type="file" id="fileInput" multiple accept="image/jpeg, image/png, image/webp">
            </div>

            <div class="action-bar">
                <button id="compressBtn" class="btn btn-primary" disabled>
                    <i data-lucide="cpu"></i>
                    <span>Compress Images</span>
                    <i data-lucide="loader-2" class="spinner" id="btnSpinner"></i>
                </button>
                <button id="downloadAllBtn" class="btn btn-success">
                    <i data-lucide="download"></i>
                    Download All (.zip)
                </button>
            </div>

            <!-- Results Section -->
            <div class="results-container" id="resultsContainer">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Preview</th>
                            <th>File Name</th>
                            <th>Original Size</th>
                            <th>Compressed Size</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const compressBtn = document.getElementById('compressBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsBody = document.getElementById('resultsBody');
        const btnSpinner = document.getElementById('btnSpinner');

        let selectedFiles = [];
        let compressedResults = []; // Stores {blob, name} pairs for global download

        // Trigger file input click
        dropZone.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.closest('button') === null) return;
            fileInput.click();
        });
        dropZone.querySelector('button').addEventListener('click', () => fileInput.click());

        // Drag & Drop handlers
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--primary)'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = 'var(--border)'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--border)';
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
            for (let file of files) {
                if (validTypes.includes(file.type)) {
                    selectedFiles.push(file);
                }
            }
            if (selectedFiles.length > 0) {
                compressBtn.disabled = false;
                compressBtn.querySelector('span').textContent = `Compress ${selectedFiles.length} Image(s)`;
            }
        }

        // --- Core Compression Logic ---
        function compressToTargetSize(file, targetKb, mimeType) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let originalWidth = img.width;
                    let originalHeight = img.height;
                    
                    // Boundary Limit to safeguard mobile engines from crashing
                    const maxDim = 2500;
                    if(originalWidth > maxDim || originalHeight > maxDim) {
                        if(originalWidth > originalHeight) {
                            originalHeight = Math.round((originalHeight * maxDim) / originalWidth);
                            originalWidth = maxDim;
                        } else {
                            originalWidth = Math.round((originalWidth * maxDim) / originalHeight);
                            originalHeight = maxDim;
                        }
                    }
                    
                    canvas.width = originalWidth;
                    canvas.height = originalHeight;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, originalWidth, originalHeight);

                    if(mimeType === 'image/png') {
                        let scale = 0.9;
                        function stepDownPng() {
                            canvas.width = originalWidth * scale;
                            canvas.height = originalHeight * scale;
                            
                            // Context recreation is MANDATORY after dimension resizing
                            const newCtx = canvas.getContext('2d');
                            newCtx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            
                            canvas.toBlob((blob) => {
                                if (blob && (blob.size / 1024 <= targetKb || scale < 0.2)) {
                                    resolve(blob);
                                } else {
                                    scale -= 0.1;
                                    stepDownPng();
                                }
                            }, mimeType);
                        }
                        
                        canvas.toBlob((blob) => {
                            if(blob && blob.size / 1024 <= targetKb) resolve(blob);
                            else stepDownPng();
                        }, mimeType);
                        
                    } else {
                        // Strict Binary Search quality algorithm for lossy engines (JPEG/WebP)
                        let low = 0.01;
                        let high = 1.0;
                        let bestBlob = null;
                        let iterations = 0;
                        
                        // Seed fallback with lowest possible baseline to secure code from 0kb generation loops
                        canvas.toBlob((fallbackBlob) => {
                            bestBlob = fallbackBlob;
                            
                            function checkQuality() {
                                if(iterations > 10) {
                                    resolve(bestBlob);
                                    return;
                                }
                                iterations++;
                                const mid = (low + high) / 2;
                                canvas.toBlob((blob) => {
                                    if(!blob) { reject(new Error('Canvas runtime error')); return; }
                                    const currentKb = blob.size / 1024;
                                    if(currentKb <= targetKb) {
                                        bestBlob = blob; // Track optimized state
                                        low = mid; 
                                    } else {
                                        high = mid;
                                    }
                                    checkQuality();
                                }, mimeType, mid);
                            }
                            checkQuality();
                        }, mimeType, 0.01);
                    }
                };
                img.onerror = (e) => reject(e);
            });
        }

        // Trigger Loop Processing Engine
        compressBtn.addEventListener('click', async () => {
            const targetSizeKb = parseFloat(document.getElementById('targetSize').value);
            if (!targetSizeKb || targetSizeKb <= 0) return;

            // UI Adjustments
            compressBtn.disabled = true;
            btnSpinner.style.display = 'inline-block';
            resultsBody.innerHTML = '';
            resultsContainer.style.display = 'block';
            compressedResults = [];

            for (let file of selectedFiles) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img class="preview-img" src="${URL.createObjectURL(file)}" alt="preview"></td>
                    <td>${file.name}</td>
                    <td>${(file.size / 1024).toFixed(1)} KB</td>
                    <td class="comp-size">Processing...</td>
                    <td><span class="badge badge-danger">Processing</span></td>
                    <td>-</td>
                `;
                resultsBody.appendChild(tr);

                try {
                    const outBlob = await compressToTargetSize(file, targetSizeKb, file.type);
                    compressedResults.push({ blob: outBlob, name: file.name });

                    const compressedKb = outBlob.size / 1024;
                    const sizeTd = tr.querySelector('.comp-size');
                    sizeTd.textContent = `${compressedKb.toFixed(1)} KB`;

                    const badgeSpan = tr.querySelector('.badge');
                    badgeSpan.className = 'badge badge-success';
                    badgeSpan.textContent = 'Success';

                    const actionTd = tr.querySelectorAll('td')[5];
                    const url = URL.createObjectURL(outBlob);
                    actionTd.innerHTML = `
                        <a href="${url}" download="compressed_${file.name}" class="download-link">
                            <i data-lucide="download" style="width:16px; height:16px;"></i> Download
                        </a>
                    `;
                } catch (err) {
                    console.error(err);
                    tr.querySelector('.comp-size').textContent = 'Error';
                    tr.querySelector('.badge').textContent = 'Failed';
                }
            }

            lucide.createIcons();
            btnSpinner.style.display = 'none';
            compressBtn.disabled = false;
            if (compressedResults.length > 0) downloadAllBtn.style.display = 'inline-flex';
            selectedFiles = []; // Flush tracking container state
        });

        // Mass Download Downloader Implementation
        downloadAllBtn.addEventListener('click', () => {
            if(compressedResults.length === 0) return;

            compressedResults.forEach((item, index) => {
                setTimeout(() => {
                    const url = URL.createObjectURL(item.blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `compressed_${item.name}`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    // Cleanup URL to release memory allocations
                    setTimeout(() => URL.revokeObjectURL(url), 100);
                }, index * 200); // 200ms delay protects browsers from blocking bulk popups
            });
        });
    </script>
</body>
</html>
